name: Validation

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      source-commit:
        type: string
        required: true
    outputs:
      artifact-id:
        value: ${{ jobs.windows-x64.outputs.artifact-id }}

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 90
    outputs:
      artifact-id: ${{ steps.packages.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source-commit || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.28.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.9'
          architecture: x64

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Install NSIS and CMake
        run: choco install nsis cmake --yes --no-progress

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Install frontend dependencies
        run: pnpm -C ui install --frozen-lockfile

      - name: Release pipeline tests
        run: python -m unittest discover -s scripts -p test_release.py

      - name: Prepare verified ConPTY runtime
        run: ./scripts/Prepare-ConPty.ps1

      - name: ConPTY package validation regressions
        run: ./scripts/Test-ConPty.ps1

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Patched ssh-key formatting
        run: cargo fmt --manifest-path vendor/ssh-key/Cargo.toml -- --check

      - name: Rust tests
        run: cargo test --locked --workspace

      - name: Tauri runtime tests
        run: cargo test --locked -p capstan-app --features tauri-runtime

      # The runtime build generates the ACL schema imported by the frontend tests.
      - name: Build frontend for Tauri custom-protocol checks
        run: pnpm -C ui build

      - name: Synthetic measurement contracts
        run: cargo test --locked --workspace --all-features

      - name: M2 workflow and relay tool regressions
        shell: powershell
        run: ./scripts/Test-M2WorkflowTools.ps1 -EvidenceDirectory ./target/ci-m2-workflow-tools

      - name: Tauri runtime build check
        run: cargo check --locked -p capstan-app --features tauri-runtime

      - name: Tauri runtime clippy
        run: cargo clippy --locked --workspace --all-targets --features tauri-runtime -- -D warnings

      - name: Rust clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: All-feature clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Native Windows formatting
        run: cargo fmt --manifest-path vendor/capstan-native-windows/Cargo.toml -- --check

      - name: Native Windows clippy
        run: cargo clippy --locked --manifest-path vendor/capstan-native-windows/Cargo.toml --all-targets -- -D warnings

      - name: Native Windows tests
        run: cargo test --locked --manifest-path vendor/capstan-native-windows/Cargo.toml

      - name: Dependency audit
        run: cargo deny check all

      - name: License metadata
        run: ./scripts/Check-Licenses.ps1

      - name: Frontend types
        run: pnpm -C ui typecheck

      - name: Frontend unit tests
        run: pnpm -C ui test

      - name: Frontend terminal security
        run: pnpm -C ui test:security

      - name: Frontend terminal layout
        run: pnpm -C ui test:layout

      - name: Frontend SFTP layout
        run: pnpm -C ui test:sftp-layout

      - name: Build and verify Windows x64 packages
        shell: powershell
        run: ./scripts/Build-CiPackages.ps1

      - name: NSIS update failure recovery
        shell: powershell
        run: ./scripts/Test-M4Update.ps1 -IsolatedHarness -EvidenceDirectory target/ci-m4-update

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        id: packages
        with:
          name: capstan-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci-packages/
          retention-days: 14
          if-no-files-found: error

  openssh-ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source-commit || github.sha }}
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.96.0

      - name: Ensure OpenSSH server is available
        run: |
          if [[ ! -x /usr/sbin/sshd ]]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends openssh-server
          fi

      - name: Exercise isolated OpenSSH compatibility
        run: bash scripts/test-ci-openssh.sh
