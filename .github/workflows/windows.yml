name: Windows validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.9'
          architecture: x64

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Install NSIS and CMake
        run: choco install nsis cmake --yes --no-progress

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Install frontend dependencies
        run: pnpm -C ui install --frozen-lockfile

      - name: Prepare verified ConPTY runtime
        run: ./scripts/Prepare-ConPty.ps1

      - name: ConPTY package validation regressions
        run: ./scripts/Test-ConPty.ps1

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Patched ssh-key formatting
        run: cargo fmt --manifest-path vendor/ssh-key/Cargo.toml -- --check

      - name: Rust tests
        run: cargo test --workspace

      - name: Tauri runtime tests
        run: cargo test -p capstan-app --features tauri-runtime

      - name: Synthetic measurement contracts
        run: cargo test --workspace --all-features

      - name: M2 workflow and relay tool regressions
        shell: powershell
        run: ./scripts/Test-M2WorkflowTools.ps1 -EvidenceDirectory ./target/ci-m2-workflow-tools

      - name: Tauri runtime build check
        run: cargo check -p capstan-app --features tauri-runtime

      - name: Tauri runtime clippy
        run: cargo clippy --workspace --all-targets --features tauri-runtime -- -D warnings

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: All-feature clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Native Windows formatting
        run: cargo fmt --manifest-path vendor/capstan-native-windows/Cargo.toml -- --check

      - name: Native Windows clippy
        run: cargo clippy --manifest-path vendor/capstan-native-windows/Cargo.toml --all-targets -- -D warnings

      - name: Native Windows tests
        run: cargo test --manifest-path vendor/capstan-native-windows/Cargo.toml

      - name: Dependency audit
        run: cargo deny check all

      - name: License metadata
        run: ./scripts/Check-Licenses.ps1

      - name: Frontend types
        run: pnpm -C ui typecheck

      - name: Frontend unit tests
        run: pnpm -C ui test

      - name: Frontend terminal security
        run: pnpm -C ui test:security

      - name: Frontend terminal layout
        run: pnpm -C ui test:layout

      - name: Frontend SFTP layout
        run: pnpm -C ui test:sftp-layout

      - name: Frontend build
        run: pnpm -C ui build

      - name: Build unsigned NSIS installer
        run: pnpm bundle:nsis

      - name: Build portable archive
        run: pnpm portable:package

      - uses: actions/upload-artifact@v4
        with:
          name: capstan-windows-x64-unsigned
          path: |
            target/release/bundle/nsis/*.exe
            target/bundle/portable/*.zip
          if-no-files-found: error
