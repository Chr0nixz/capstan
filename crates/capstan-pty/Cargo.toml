[package]
name = "capstan-pty"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Local shell and terminal transport primitives for Capstan"

[features]
m0-benchmarks = []

[[bin]]
name = "capstan-m0-fixture"
path = "src/bin/m0-fixture.rs"
required-features = ["m0-benchmarks"]

[dependencies]
capstan-terminal = { path = "../capstan-terminal" }
dunce = "=1.0.5"
portable-pty = "=0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "2.0.17"
tokio = { version = "=1.53.3", features = ["macros", "process", "rt", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
