[package]
name = "capstan-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Capstan application workflows without a UI framework dependency"

[features]
benchmarks = []

[[example]]
name = "m2_manual_fixture"
required-features = ["benchmarks"]
test = true

[dependencies]
capstan-vault = { path = "../capstan-vault" }
capstan-ssh = { path = "../capstan-ssh" }
capstan-terminal = { path = "../capstan-terminal" }
async-trait = "=0.1.89"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
secrecy = "=0.10.3"
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
uuid = { version = "=1.27.0", features = ["v4", "serde"] }
zeroize = "=1.9.0"
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
capstan-native-windows = { path = "../../vendor/capstan-native-windows" }

[dev-dependencies]
tempfile = "=3.27.0"
russh = { version = "=0.61.2", default-features = false, features = ["ring", "rsa"] }
rand = "=0.10.2"

[lints]
workspace = true
