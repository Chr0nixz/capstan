[package]
name = "capstan-ssh"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Async SSH trust, authentication, connection leases and channels"

[dependencies]
async-trait = "=0.1.89"
capstan-terminal = { path = "../capstan-terminal" }
russh = { version = "=0.61.2", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=3.0.1"
secrecy = "=0.10.3"
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "test-util"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
uuid = { version = "=1.27.0", features = ["v4", "serde"] }
zeroize = "=1.9.0"

[dev-dependencies]
rand = "=0.10.2"
serde_json = "=1.0.151"
sha2 = "=0.10.9"
signature = "=3.0.0"

[lints]
workspace = true
