[package]
name = "capstan-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Backend-neutral terminal flow control and session lifecycle"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["macros", "rt", "sync", "time", "io-util"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }

[dev-dependencies]
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "sync", "time", "io-util"] }
serde_json = "=1.0.151"

[lints]
workspace = true
