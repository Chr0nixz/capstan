[package]
name = "tauri-plugin-snap-layout"
version = "1.0.9"
edition = "2021"
rust-version = "1.80"
license = "MIT"
links = "tauri-plugin-snap-layout"
description = "Capstan's restricted adapter for native Windows Snap Layout hit testing"
repository = "https://github.com/Hyph-M/tauri-plugin-snap-layout"

[dependencies]
tauri = "=2.12.1"
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["sync"] }

[build-dependencies]
tauri-plugin = { version = "=2.7.1", features = ["build"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
