[package]
name = "russh-sftp"
version = "3.0.1"
edition = "2021"
license = "Apache-2.0"
description = "SFTP subsystem supported server and client for Russh"
repository = "https://github.com/AspectUnk/russh-sftp"
autoexamples = false
autobenches = false

[features]
async-trait = ["dep:async-trait"]

[dependencies]
async-trait = { version = "=0.1.89", optional = true }
bitflags = { version = "=2.13.2", features = ["serde"] }
bytes = "=1.12.1"
chrono = "=0.4.45"
dashmap = "=6.2.1"
log = "=0.4.34"
serde = { version = "=1.0.229", features = ["derive"] }
serde_bytes = "=0.11.19"
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", default-features = false, features = ["io-util", "rt", "sync", "time", "macros"] }
tokio-util = { version = "=0.7.19", default-features = false, features = ["rt"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "=0.4.0", features = ["futures"] }
wasm-bindgen-futures = "=0.4.79"

[workspace]
members = ["."]
